<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IB MYP Physics - Motion, Models &amp; Mechanics Part 2 (M10)</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Fira+Code&display=swap" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <style>
        :root {
            --primary: #10b981;
            --primary-dark: #059669;
            --secondary: #06b6d4;
            --danger: #ef4444;
            --warning: #f59e0b;
            --bg-dark: #0f172a;
            --bg-card: #1e293b;
            --bg-hover: #334155;
            --text-primary: #f8fafc;
            --text-secondary: #94a3b8;
            --text-muted: #64748b;
            --border: #475569;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Inter', sans-serif;
            background: var(--bg-dark);
            color: var(--text-primary);
            min-height: 100vh;
        }

        .app-container { display: flex; min-height: 100vh; }

        .sidebar {
            width: 290px;
            background: var(--bg-card);
            border-right: 1px solid var(--border);
            padding: 20px;
            display: flex;
            flex-direction: column;
            position: fixed;
            top: 0; left: 0; bottom: 0;
            overflow-y: auto;
        }

        .logo { display: flex; align-items: center; gap: 12px; margin-bottom: 20px; padding-bottom: 16px; border-bottom: 1px solid var(--border); }
        .logo-icon { width: 42px; height: 42px; background: linear-gradient(135deg, var(--secondary), var(--primary)); border-radius: 10px; display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: 13px; color: #04211a; flex-shrink: 0; }
        .logo-text h1 { font-size: 14px; font-weight: 600; }
        .logo-text span { font-size: 11px; color: var(--text-secondary); }

        .timer-container { background: rgba(6,182,212,0.1); border: 1px solid var(--secondary); border-radius: 12px; padding: 16px; margin-bottom: 18px; text-align: center; }
        .timer-label { font-size: 12px; color: var(--text-secondary); margin-bottom: 4px; }
        .timer { font-size: 30px; font-weight: 700; font-family: 'Fira Code', monospace; color: var(--secondary); }
        .timer.warning { color: var(--warning); animation: pulse 1s infinite; }
        .timer.danger { color: var(--danger); }
        @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.5; } }

        .progress-section { margin-bottom: 18px; }
        .progress-text { display: flex; justify-content: space-between; font-size: 12px; margin-bottom: 8px; color: var(--text-secondary); }
        .progress-bar { height: 8px; background: var(--bg-dark); border-radius: 4px; overflow: hidden; }
        .progress-fill { height: 100%; background: linear-gradient(90deg, var(--secondary), var(--primary)); transition: width 0.3s ease; }

        .nav-label { font-size: 11px; color: var(--text-secondary); margin-bottom: 10px; text-transform: uppercase; letter-spacing: 1px; }
        .question-nav { display: grid; grid-template-columns: repeat(5, 1fr); gap: 6px; margin-bottom: 18px; }
        .nav-q { aspect-ratio: 1; border: 2px solid var(--border); background: var(--bg-dark); border-radius: 6px; color: var(--text-secondary); font-weight: 600; font-size: 12px; cursor: pointer; display: flex; align-items: center; justify-content: center; transition: all 0.2s; }
        .nav-q:hover { border-color: var(--primary); }
        .nav-q.current { background: var(--primary); border-color: var(--primary); color: #04211a; }
        .nav-q.answered { border-color: var(--secondary); color: var(--secondary); }
        .nav-q.current.answered { background: var(--primary); color: #04211a; }

        .sidebar-footer { margin-top: auto; display: flex; flex-direction: column; gap: 10px; }
        .home-link { display: block; text-align: center; color: var(--text-secondary); text-decoration: none; font-size: 12px; padding: 10px 0; border-top: 1px solid var(--border); }
        .home-link:hover { color: var(--primary); }

        .main { margin-left: 290px; padding: 32px; flex: 1; min-width: 0; }
        .question-container { max-width: 900px; margin: 0 auto; }

        .unit-banner {
            background: linear-gradient(135deg, rgba(6,182,212,0.14), rgba(16,185,129,0.07));
            border: 1px solid var(--secondary);
            border-radius: 14px;
            padding: 18px 22px;
            margin-bottom: 22px;
        }
        .unit-banner .tag { display: inline-block; font-size: 11px; letter-spacing: 1.2px; text-transform: uppercase; color: var(--primary); font-weight: 700; margin-bottom: 6px; }
        .unit-banner h1 { font-size: 21px; margin-bottom: 6px; }
        .unit-banner p { font-size: 13px; color: var(--text-secondary); }

        .question-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 18px; }
        .question-num { font-size: 15px; font-weight: 600; color: var(--text-secondary); }
        .marks { padding: 5px 14px; border-radius: 20px; font-size: 12px; font-weight: 700; background: rgba(16,185,129,0.18); color: var(--primary); white-space: nowrap; }
        .topic-pill { display: inline-block; font-size: 11px; padding: 4px 12px; border-radius: 20px; background: rgba(139,92,246,0.18); color: #a78bfa; font-weight: 600; margin-bottom: 14px; }

        .question-card { background: var(--bg-card); border-radius: 16px; padding: 30px; border: 1px solid var(--border); }
        .question-text { font-size: 16px; line-height: 1.75; color: var(--text-primary); margin-bottom: 22px; }
        .question-text h2 { font-size: 16px; font-weight: 500; }

        .options { display: flex; flex-direction: column; gap: 12px; }
        .option { background: var(--bg-dark); border: 2px solid var(--border); border-radius: 12px; padding: 18px 22px; cursor: pointer; transition: all 0.2s; display: flex; align-items: flex-start; gap: 16px; }
        .option:hover { border-color: var(--text-secondary); background: var(--bg-hover); }
        .option.selected { border-color: var(--primary); background: rgba(16,185,129,0.1); }
        .option-marker { width: 30px; height: 30px; background: var(--bg-card); border-radius: 8px; display: flex; align-items: center; justify-content: center; font-weight: 600; font-size: 13px; flex-shrink: 0; }
        .option.selected .option-marker { background: var(--primary); color: #04211a; }
        .option-text { font-size: 14.5px; line-height: 1.6; color: var(--text-secondary); }
        .option.selected .option-text { color: var(--text-primary); }

        /* ---------- Data tables inside questions ---------- */
        .data-table { width: 100%; border-collapse: collapse; margin: 18px 0; font-size: 13px; font-family: 'Fira Code', monospace; }
        .data-table th { background: var(--bg-dark); color: var(--secondary); padding: 9px 10px; text-align: left; font-size: 11px; text-transform: uppercase; letter-spacing: 0.5px; border-bottom: 1px solid var(--border); }
        .data-table td { padding: 8px 10px; border-bottom: 1px solid var(--border); color: var(--text-secondary); }
        .data-table .hl { color: var(--primary); font-weight: 600; }

        .ascii-chart { font-family: 'Fira Code', monospace; font-size: 12.5px; line-height: 1.5; background: var(--bg-dark); border: 1px solid var(--border); border-radius: 10px; padding: 20px; margin: 18px 0; overflow-x: auto; color: var(--text-secondary); }
        .ascii-chart .ax { color: var(--text-muted); }
        .ascii-chart .lbl { color: var(--secondary); }
        .ascii-chart .bar { color: var(--primary); }

        .input-answer { background: var(--bg-card); border-radius: 12px; padding: 22px; border: 1px solid var(--border); }
        .input-answer label { display: block; font-size: 13px; color: var(--text-secondary); margin-bottom: 10px; font-weight: 500; }
        .input-answer textarea { width: 100%; background: var(--bg-dark); border: 1px solid var(--border); border-radius: 8px; padding: 16px; color: var(--text-primary); font-size: 14.5px; font-family: 'Inter', sans-serif; line-height: 1.7; min-height: 170px; resize: vertical; }
        .input-answer textarea:focus { outline: none; border-color: var(--primary); }
        .input-answer textarea.essay { min-height: 340px; }
        .word-count { font-size: 11px; color: var(--text-muted); text-align: right; margin-top: 8px; }

        .reference-box { background: rgba(245,158,11,0.08); border-left: 3px solid var(--warning); padding: 14px 16px; margin: 16px 0; border-radius: 0 8px 8px 0; }
        .reference-box h4 { font-size: 11px; color: var(--warning); margin-bottom: 6px; text-transform: uppercase; letter-spacing: 0.5px; }
        .reference-box p { font-size: 13.5px; color: var(--text-secondary); line-height: 1.65; }
        .reference-box p strong { color: var(--primary); }

        .nav-buttons { display: flex; justify-content: space-between; margin-top: 22px; }

        .btn { padding: 13px 26px; border-radius: 10px; font-weight: 600; font-size: 14px; cursor: pointer; border: none; transition: all 0.2s; display: inline-flex; align-items: center; gap: 8px; font-family: 'Inter', sans-serif; }
        .btn-primary { background: var(--primary); color: #04211a; }
        .btn-primary:hover { background: var(--primary-dark); }
        .btn-secondary { background: var(--bg-card); color: var(--text-primary); border: 1px solid var(--border); }
        .btn-secondary:hover { border-color: var(--primary); color: var(--primary); }
        .btn:disabled { opacity: 0.4; cursor: not-allowed; }

        .modal-overlay { position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0,0,0,0.85); display: flex; align-items: center; justify-content: center; z-index: 1000; opacity: 0; visibility: hidden; transition: all 0.3s; padding: 20px; }
        .modal-overlay.show { opacity: 1; visibility: visible; }
        .modal { background: var(--bg-card); border-radius: 20px; padding: 38px; max-width: 520px; width: 100%; text-align: center; border: 1px solid var(--border); }
        .modal h2 { font-size: 26px; margin-bottom: 12px; }
        .modal-score { font-size: 64px; font-weight: 700; color: var(--primary); margin: 18px 0; font-family: 'Fira Code', monospace; }
        .modal-score-sub { font-size: 13px; color: var(--text-muted); margin-bottom: 22px; }
        .modal p { color: var(--text-secondary); margin-bottom: 28px; }
        .modal-btns { display: flex; gap: 12px; justify-content: center; flex-wrap: wrap; }

        .breakdown { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-bottom: 26px; }
        .breakdown .b { background: var(--bg-dark); border-radius: 10px; padding: 14px 8px; }
        .breakdown .b .n { font-size: 22px; font-weight: 700; }
        .breakdown .b .l { font-size: 11px; color: var(--text-secondary); }
        .breakdown .b.a .n { color: var(--primary); }
        .breakdown .b.i .n { color: var(--danger); }
        .breakdown .b.s .n { color: var(--warning); }

        .review-link { display: inline-block; margin-top: 18px; color: var(--text-muted); font-size: 13px; text-decoration: none; border-bottom: 1px dashed var(--border); }
        .review-link:hover { color: var(--secondary); }

        @media (max-width: 900px) {
            .app-container { flex-direction: column; }
            .sidebar { position: relative; width: 100%; border-right: none; border-bottom: 1px solid var(--border); }
            .main { margin-left: 0; padding: 20px; }
            .question-card { padding: 20px; }
        }
    </style>
</head>
<body>
    <div class="app-container">
        <aside class="sidebar">
            <div class="logo">
                <div class="logo-icon">PHY</div>
                <div class="logo-text">
                    <h1>IB_Expert_ISSR</h1>
                    <span>IB MYP Physics &middot; M10</span>
                </div>
            </div>

            <div class="progress-section">

                    <span>Progress</span>
                    <span id="progress-text">0 / 29</span>
                </div>

                <button class="btn btn-primary" onclick="submitQuiz()">Submit &amp; Finish</button>
                <a href="m10-physics-motion-study.html" class="btn btn-secondary">Study Material</a>

    <div class="modal-overlay" id="modal">
        <div class="modal">
            <h2>Assessment Complete</h2>
            <div class="modal-score" id="modal-score">0%</div>
            <div class="modal-score-sub" id="modal-marks">0 / 0 marks</div>
            <div class="breakdown">
                <div class="b a"><div class="n" id="mcq-count">0</div><div class="l">MCQ correct</div></div>
                <div class="b i"><div class="n" id="wrong-count">0</div><div class="l">Incomplete</div></div>
                <div class="b s"><div class="n" id="skip-count">0</div><div class="l">Skipped</div></div>
            </div>

                <button class="btn btn-primary" onclick="downloadPDF()">Download Results</button>
                <button class="btn btn-secondary" onclick="showMarkScheme()">Mark Scheme</button>
                <button class="btn btn-secondary" onclick="window.location.href='m10-physics-motion-study.html'">Study More</button>
            </div>
            <a href="#" class="review-link" onclick="showReview(); return false;">Review every answer</a>
        </div>
    </div>

    <div class="modal-overlay" id="scheme-modal">
        <div class="modal" style="max-width: 760px; text-align: left;">
            <h2 style="text-align:center;">Mark Scheme</h2>
            <div id="scheme-body" style="max-height: 60vh; overflow-y: auto; font-size: 14px; color: var(--text-secondary);"></div>
            <div class="modal-btns" style="margin-top: 24px;">
                <button class="btn btn-secondary" onclick="document.getElementById('scheme-modal').classList.remove('show')">Close</button>
            </div>
        </div>
    </div>

    <script>
        const questions = [
    /* ================= NEWTONS LAWS (CONCEPTUAL) ================= */
    {
        id: 1, type: "mcq", topic: "Newton's Laws", marks: 1,
        text: "The SI unit of force, the newton (N), is equivalent to:",
        options: ["kg &middot; m/s", "kg &middot; m/s&sup2;", "kg / m&sup2;", "J/s"],
        correct: 1,
        explanation: "From F = ma: kg &times; m/s&sup2; = N. kg&middot;m/s is momentum units; J/s is power."
    },
    {
        id: 2, type: "mcq", topic: "F = ma Calculations", marks: 1,
        text: "A net force of 12 N acts on a 4 kg cart. The acceleration is:",
        options: ["48 m/s&sup2;", "0.33 m/s&sup2;", "8 m/s&sup2;", "3 m/s&sup2;"],
        correct: 3,
        explanation: "a = F/m = 12/4 = 3 m/s&sup2;. Option A multiplied instead of dividing &mdash; acceleration is force PER mass."
    },
    {
        id: 3, type: "mcq", topic: "Newton's Laws", marks: 1,
        text: "An object has zero net force acting on it. It must:",
        options: ["Be at rest", "Be moving at constant velocity (which may include rest)", "Be accelerating", "Have no forces at all acting on it"],
        correct: 1,
        explanation: "Newton's 1st law: zero net force &rarr; velocity unchanged. Rest is just the special case v = 0. Balanced forces still act &mdash; they sum to zero."
    },
    {
        id: 4, type: "mcq", topic: "Newton's Laws", marks: 1,
        text: "Newton's 1st law states that an object:",
        options: ["Always moves in the direction of the net force", "Keeps its velocity (rest or uniform motion) unless a net force acts", "Accelerates in proportion to the net force", "Experiences forces in equal-and-opposite pairs on the same object"],
        correct: 1,
        explanation: "That is the 1st (inertia) law. Option C is the 2nd law; option D corrupts the 3rd law &mdash; pairs act on different objects, never the same one."
    },
    {
        id: 5, type: "mcq", topic: "Forces & FBD", marks: 1,
        text: "The gravitational force (weight) on an object is calculated using:",
        options: ["F<sub>g</sub> = mg", "F<sub>net</sub> = ma only", "F = mv", "F = mg/t"],
        correct: 0,
        explanation: "Weight = mass &times; gravitational field strength. F = ma is the general 2nd law &mdash; F<sub>g</sub> = mg is the specific case where the acceleration is g."
    },
    {
        id: 6, type: "mcq", topic: "Forces & FBD", marks: 1,
        text: "An astronaut travels from Earth to the Moon. Compared with Earth, on the Moon her mass is &hellip; and her weight is &hellip;",
        options: ["the same, the same", "smaller, the same", "the same, smaller", "larger, smaller"],
        correct: 2,
        explanation: "Mass = amount of matter &mdash; unchanged. Weight = mg &mdash; g on the Moon is about 1.6 N/kg, roughly one-sixth of Earth's, so weight shrinks."
    },
    {
        id: 7, type: "mcq", topic: "Newton's Laws", marks: 1,
        text: "A book rests on a table. The Newton's 3rd law partner of 'the table pushes up on the book' is:",
        options: ["The Earth pulls down on the book", "The book pushes down on the table", "The book's weight", "The table pushing up, since forces always come in pairs on one object"],
        correct: 1,
        explanation: "3rd-law pairs swap the two objects of one interaction: table-on-book &harr; book-on-table, equal and opposite. Weight is Earth-on-book &mdash; a different interaction."
    },
    {
        id: 8, type: "mcq", topic: "Newton's Laws", marks: 1,
        text: "A Newton's 3rd law pair of forces always:",
        options: ["Acts on the same object and cancels", "Acts on two different objects, so it can never cancel", "Only exists when the objects are at rest", "Has different magnitudes when the objects accelerate"],
        correct: 1,
        explanation: "Each partner acts on a different body, so there is nothing to add together on one free-body diagram. Equality of size holds regardless of motion."
    },
    {
        id: 9, type: "mcq", topic: "Forces & FBD", marks: 1,
        text: "Using the MYP data sheet, the acceleration due to gravity g used in calculations is:",
        options: ["9.81 m/s&sup2;", "10 m/s&sup2;", "1.6 m/s&sup2;", "0 m/s&sup2;"],
        correct: 1,
        explanation: "The data sheet rounds g to 10 m/s&sup2;. Some handouts use 9.81 &mdash; always use the value the question states and say which you used."
    },
    {
        id: 10, type: "mcq", topic: "Forces & FBD", marks: 1,
        text: "A skydiver falls with air resistance. Compared with free fall (a = g), her acceleration is:",
        options: ["Less than g, because drag partially opposes weight", "Greater than g, because two forces act", "Exactly g, because weight is unchanged", "Zero, because the forces are balanced"],
        correct: 0,
        explanation: "F<sub>net</sub> = weight &minus; drag &lt; weight, so a = F<sub>net</sub>/m &lt; g. Not zero (that is terminal velocity), and two forces do not add &mdash; they oppose."
    },
    {
        id: 11, type: "mcq", topic: "Forces & FBD", marks: 1,
        text: "An elevator rises at a constant velocity. The tension T in the cable compared with the elevator's weight W is:",
        options: ["T &gt; W, to keep it moving up", "T &lt; W, because it is already moving", "T = W, because the forces are balanced", "T = 0, because constant velocity needs no force"],
        correct: 2,
        explanation: "Constant velocity &rarr; zero acceleration &rarr; F<sub>net</sub> = 0 (1st law) &rarr; T = W. 'Force is needed to keep moving' is the Aristotle misconception the 1st law demolishes."
    },
    {
        id: 12, type: "mcq", topic: "F = ma Calculations", marks: 1,
        text: "A constant net force gives a 2 kg body an acceleration of 3 m/s&sup2;. If the same force acts on a 4 kg body, its acceleration is:",
        options: ["12 m/s&sup2;", "6 m/s&sup2;", "3 m/s&sup2;", "1.5 m/s&sup2;"],
        correct: 3,
        explanation: "F = ma = 6 N; on 4 kg, a = 6/4 = 1.5 m/s&sup2;. Doubling the mass halves the acceleration &mdash; a is inversely proportional to m."
    },
    {
        id: 13, type: "mcq", topic: "F = ma Calculations", marks: 1,
        text: "The same net force acts on masses M and 4M. The acceleration of M compared with that of 4M is:",
        options: ["The same", "One quarter as big", "Four times as big", "Twice as big"],
        correct: 2,
        explanation: "a = F/m, so quadrupling the mass quarters the acceleration &mdash; M accelerates four times faster than 4M."
    },
    {
        id: 14, type: "mcq", topic: "Forces & FBD", marks: 1,
        text: "A book lies at rest on a table. The forces that appear on its free-body diagram are:",
        options: ["Its weight down and the table's support force up", "Its weight down and the 3rd-law pair of that weight", "The book's weight, the table's support, and the 'force of motion'", "Only the table's support, since the book does not fall"],
        correct: 0,
        explanation: "An FBD shows forces ON the book: gravity (Earth on book) and the normal support (table on book). The 3rd-law partners act ON other objects and never appear on this diagram."
    },
    {
        id: 15, type: "mcq", topic: "Forces & FBD", marks: 1,
        text: "Kinetic friction on a sliding block acts:",
        options: ["In the direction of the block's motion", "Opposite to the direction of the block's motion relative to the surface", "Only when the block is at rest", "Downwards, like weight"],
        correct: 1,
        explanation: "Friction opposes relative sliding &mdash; so for a block sliding right, friction acts left. Static friction instead opposes the attempted motion of a stationary block."
    },
    /* ================= SHORT: WEIGHT & F=ma ================= */
    {
        id: 16, type: "short", topic: "F = ma Calculations", marks: 5,
        text: "An African elephant has a mass of 6000 kg. Using g = 10 m/s&sup2;:<br><br>a) Calculate its weight on Earth. <strong>[2]</strong><br>b) State its mass on the Moon, and calculate its weight there where g &asymp; 1.6 N/kg. <strong>[2]</strong><br>c) State why the mass does not change between Earth and Moon. <strong>[1]</strong>",
        placeholder: "a) Fg = mg = ...\nb) mass = ... weight = ...\nc) Because...",
        keywords: ["60000", "60 000", "6000", "9600", "9 600", "1.6", "10", "matter", "same", "amount", "gravitational", "mass"],
        scheme: [
            "F<sub>g</sub> = mg = 6000 &times; 10 = 60 000 N (accept 6.0 &times; 10&sup4; N; 58 800 N if g = 9.81 stated and used consistently)",
            "Unit N given",
            "Mass on the Moon = 6000 kg (unchanged)",
            "Weight on Moon = 6000 &times; 1.6 = 9600 N",
            "Mass measures the amount of matter, which does not depend on the local gravitational field"
        ]
    },
    {
        id: 17, type: "short", topic: "F = ma Calculations", marks: 6,
        text: "The average mass of an adult is 86 kg. Using g = 10 m/s&sup2; on Earth and g = 1.6 N/kg on the Moon:<br><br>a) Calculate the weight on Earth. <strong>[2]</strong><br>b) Calculate the weight on the Moon. <strong>[2]</strong><br>c) Calculate the ratio of the two weights and comment on whether it matches the 'one-sixth gravity' claim. <strong>[2]</strong>",
        placeholder: "a) Earth weight = ...\nb) Moon weight = ...\nc) Ratio = ... which means...",
        keywords: ["860", "138", "86", "1.6", "10", "sixth", "1/6", "0.16", "ratio", "gravitational", "weight", "same"],
        scheme: [
            "Earth weight = 86 &times; 10 = 860 N",
            "Unit N",
            "Moon weight = 86 &times; 1.6 = 137.6 &asymp; 140 N (accept 138)",

        let answers = {};
        let currentQuestion = 0;
        let timeRemaining = 90 * 60;
        let timerInterval = null;
        let submitted = false;

        // Deterministically shuffle the options so the correct answer is not
        // always in the same position (seeded by question id: stable on reload).
        function seededShuffle(arr, seed) {
            const a = arr.slice();
            let s = seed;
            for (let i = a.length - 1; i > 0; i--) {
                s = (s * 9301 + 49297) % 233280;
                const j = Math.floor((s / 233280) * (i + 1));
                [a[i], a[j]] = [a[j], a[i]];
            }
            return a;
        }

        function init() {
            questions.forEach(q => {
                if (q.type !== 'mcq') return;
                q._opts = seededShuffle(q.options, q.id * 97 + 41);
                q._correct = q._opts.indexOf(q.options[q.correct]);
            });
            document.getElementById('modal-marks').textContent = `0 / ${questions.reduce((s, q) => s + q.marks, 0)} marks`;
            document.getElementById('progress-text').textContent = `0 / ${questions.length}`;
            renderQuestionNav();
            updateProgress();
            showQuestion(0);
            startTimer();
        }

        function startTimer() {
            timerInterval = setInterval(() => {
                timeRemaining--;
                const mins = Math.floor(timeRemaining / 60);
                const secs = timeRemaining % 60;
                const timerEl = document.getElementById('timer');
                timerEl.textContent = `${mins.toString().padStart(2, '0')}:${secs.toString().padStart(2, '0')}`;
                if (timeRemaining <= 300) { timerEl.classList.remove('warning'); timerEl.classList.add('danger'); }
                else if (timeRemaining <= 600) timerEl.classList.add('warning');
                if (timeRemaining <= 0) { clearInterval(timerInterval); submitQuiz(); }
            }, 1000);
        }

        function renderQuestionNav() {
            const nav = document.getElementById('question-nav');
            nav.innerHTML = questions.map((q, i) => {
                const answered = answers[q.id] !== undefined && answers[q.id] !== null;
                return `<div class="nav-q ${answered ? 'answered' : ''}" onclick="showQuestion(${i})">${i + 1}</div>`;
            }).join('');
            document.querySelectorAll('.nav-q').forEach((el, i) => el.classList.toggle('current', i === currentQuestion));

            const answered = questions.filter(q => answers[q.id] !== undefined && answers[q.id] !== null).length;

        function scoreQuestion(q) {
            const a = answers[q.id];
            if (a === undefined || a === null) return 0;
            if (q.type === 'mcq') return a === q._correct ? q.marks : 0;
            if (typeof a !== 'string' || a.trim().length < 20) return 0;

                if (q.type === 'mcq') { mcqTotal++; if (answers[q.id] === q._correct) mcqCorrect++; }
                if (answers[q.id] === undefined || answers[q.id] === null) skipped++; else if (s < q.marks) wrong++;
                if (!byTopic[q.topic]) byTopic[q.topic] = { score: 0, max: 0 };
                byTopic[q.topic].score += s; byTopic[q.topic].max += q.marks;
            });
            return { score, max, mcqTotal, mcqCorrect, wrong, skipped, byTopic };
        }

        function submitQuiz() {
            if (submitted) return;
            submitted = true;
            clearInterval(timerInterval);
            const r = buildResults();
            const pct = Math.round((r.score / r.max) * 100);

            document.getElementById('modal-score').textContent = `${pct}%`;
            document.getElementById('modal-marks').textContent = `${r.score} / ${r.max} marks`;
            document.getElementById('mcq-count').textContent = `${r.mcqCorrect}/${r.mcqTotal}`;
            document.getElementById('wrong-count').textContent = r.wrong;
            document.getElementById('skip-count').textContent = r.skipped;

            let msg = 'Keep practicing - revisit the study material and try again.';
            if (pct >= 85) msg = 'Outstanding! You have a strong grasp of M10 Physics mechanics.';
            else if (pct >= 70) msg = 'Strong work. Check the mark scheme for the parts you lost.';
            else if (pct >= 55) msg = 'Good start. Focus on the sections with the lowest scores below.';
            else msg = 'Revisit the study material, then retake this part.';
            document.getElementById('modal-msg').textContent = msg;

            document.getElementById('modal').classList.add('show');
            localStorage.setItem('kanimath_m10_phys_part2', JSON.stringify({
                score: r.score, max: r.max, percentage: pct,
                date: new Date().toISOString(), answers
            }));
        }

        function showMarkScheme() {
            const html = questions.filter(q => q.scheme && q.scheme.length).map(q => `
                <div style="margin-bottom: 22px; padding-bottom: 16px; border-bottom: 1px solid var(--border);">
                    <div style="font-weight: 700; color: var(--primary); margin-bottom: 6px;">Q${q.id} &middot; ${q.topic} &middot; ${q.marks} marks</div>
                    <div style="margin-bottom: 8px; font-size: 13px;">${q.text.replace(/<[^>]*>/g, '').substring(0, 150)}${q.text.length > 150 ? '...' : ''}</div>
                    <ol style="margin-left: 18px;">
                        ${q.scheme.map(s => `<li style="margin-bottom: 5px; font-size: 13px; line-height: 1.6;">${s}</li>`).join('')}
                    </ol>
                </div>`).join('');
            document.getElementById('scheme-body').innerHTML = html;
            document.getElementById('scheme-modal').classList.add('show');
        }

        function showReview() {
            const rows = questions.map(q => {
                const a = answers[q.id];
                const s = scoreQuestion(q);
                let yourAnswer, correct;
                if (q.type === 'mcq') {
                    yourAnswer = a === undefined || a === null ? '<i>Not answered</i>' : `${String.fromCharCode(65 + a)}: ${q._opts[a]}`;
                    correct = `${String.fromCharCode(65 + q._correct)}: ${q._opts[q._correct]}`;
                } else {
                    yourAnswer = a ? a.replace(/</g, '&lt;').substring(0, 300) : '<i>Not answered</i>';
                    correct = `<b>Scheme:</b> ${q.scheme.join(' ')}`;
                }
                const col = s === q.marks ? 'var(--primary)' : s > 0 ? 'var(--warning)' : 'var(--danger)';
                return `<div style="padding: 14px 0; border-bottom: 1px solid var(--border);">
                    <div style="display:flex; justify-content:space-between; margin-bottom: 6px;">
                        <b style="color: var(--text-primary);">Q${q.id} &middot; ${q.topic}</b>
                        <span style="color:${col}; font-weight:700;">${s} / ${q.marks}</span>
                    </div>
                    <div style="font-size: 13px; margin-bottom: 4px;"><b>Your answer:</b> ${yourAnswer}</div>
                    <div style="font-size: 13px;">${correct}</div>
                    ${q.explanation ? `<div style="font-size: 13px; color: var(--secondary); margin-top: 4px;">${q.explanation}</div>` : ''}
                </div>`;
            }).join('');

            const r = buildResults();
            const topicRows = Object.entries(r.byTopic).map(([t, v]) => `
                <div style="display:flex; justify-content:space-between; padding: 8px 0; border-bottom: 1px solid var(--border); font-size: 14px;">
                    <span>${t}</span><span style="font-family: 'Fira Code', monospace;">${v.score} / ${v.max}</span>
                </div>`).join('');

            document.getElementById('scheme-body').innerHTML = `
                <h3 style="color: var(--primary); margin-bottom: 12px; font-size: 15px;">Score by topic</h3>
                ${topicRows}
                <h3 style="color: var(--primary); margin: 24px 0 8px; font-size: 15px;">Every answer</h3>
                ${rows}`;
            document.getElementById('scheme-modal').classList.add('show');
        }

        function downloadPDF() {
            const { jsPDF } = window.jspdf;
            const doc = new jsPDF();
            const r = buildResults();
            const pct = Math.round((r.score / r.max) * 100);

            doc.setFontSize(18);
            doc.setTextColor(6, 182, 212);
            doc.text('IB_Expert_ISSR - IB MYP Physics (M10)', 20, 20);
            doc.setFontSize(14);
            doc.setTextColor(60);
            doc.text("Motion, Models & Mechanics - Part 2: Forces & Newton's Laws", 20, 29);
            doc.setFontSize(10);
            doc.setTextColor(120);
            doc.text(`${new Date().toLocaleDateString()}  |  Newton's Laws, Free-body Diagrams, F = ma`, 20, 36);

            doc.setFontSize(34);
            doc.setTextColor(16, 185, 129);
            doc.text(`${pct}%`, 20, 56);
            doc.setFontSize(11);
            doc.setTextColor(60);
            doc.text(`Total: ${r.score} / ${r.max} marks`, 62, 48);
            doc.text(`MCQ correct: ${r.mcqCorrect}/${r.mcqTotal}   Incomplete: ${r.wrong}   Skipped: ${r.skipped}`, 62, 56);

            let y = 72;
            doc.setFontSize(12);
            doc.setTextColor(6, 182, 212);
            doc.text('Score by topic', 20, y);
            y += 7;
            doc.setFontSize(9);
            Object.entries(r.byTopic).forEach(([t, v]) => {
                doc.setTextColor(80);
                doc.text(`${t}: ${v.score} / ${v.max} marks`, 20, y);
                y += 6;
            });

            y += 6;
            doc.setFontSize(12);
            doc.setTextColor(6, 182, 212);
            doc.text('Question results', 20, y);
            y += 7;

            questions.forEach((q) => {
                if (y > 262) { doc.addPage(); y = 20; }
                const s = scoreQuestion(q);
                doc.setFontSize(9);
                doc.setTextColor(s === q.marks ? 16 : s > 0 ? 200 : 220, s === q.marks ? 185 : s > 0 ? 150 : 68, s === q.marks ? 129 : s > 0 ? 20 : 68);
                doc.text(`Q${q.id} [${q.topic}] ${s}/${q.marks} marks`, 20, y);
                doc.setTextColor(110);
                const a = answers[q.id];
                const summary = q.type === 'mcq'
                    ? (a === undefined || a === null ? 'not answered' : `chose ${String.fromCharCode(65 + a)}`)
                    : (a ? `${a.replace(/\s+/g, ' ').substring(0, 70)}...` : 'not answered');
                doc.text(`Your answer: ${summary}`, 105, y);
                y += 6;
                if (y > 262) { doc.addPage(); y = 20; }
                doc.setTextColor(90);
                if (q.type === 'mcq') {
                    doc.text(`Correct: ${q.explanation.substring(0, 100)}`, 105, y);
                } else {
                    doc.text(`Scheme: ${q.scheme[0].replace(/<[^>]*>/g, '').substring(0, 100)}`, 105, y);
                }
                y += 8;
            });

            doc.setFontSize(8);
            doc.setTextColor(150);
            doc.text('Generated by IB_Expert_ISSR', 105, 285, { align: 'center' });
            doc.save('M10_Physics_Motion_Part2.pdf');
        }

        init();
    </script>
</body>
</html>
