<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IB MYP Science - ESS Unit A Part 1 (M10)</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Fira+Code&display=swap" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <style>
        :root {
            --primary: #10b981;
            --primary-dark: #059669;
            --secondary: #06b6d4;
            --danger: #ef4444;
            --warning: #f59e0b;
            --bg-dark: #0f172a;
            --bg-card: #1e293b;
            --bg-hover: #334155;
            --text-primary: #f8fafc;
            --text-secondary: #94a3b8;
            --text-muted: #64748b;
            --border: #475569;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Inter', sans-serif;
            background: var(--bg-dark);
            color: var(--text-primary);
            min-height: 100vh;
        }

        .app-container { display: flex; min-height: 100vh; }

        /* ---------- Sidebar ---------- */
        .sidebar {
            width: 290px;
            background: var(--bg-card);
            border-right: 1px solid var(--border);
            padding: 20px;
            display: flex;
            flex-direction: column;
            position: fixed;
            top: 0; left: 0; bottom: 0;
            width: 290px;
            overflow-y: auto;
        }

        .logo { display: flex; align-items: center; gap: 12px; margin-bottom: 20px; padding-bottom: 16px; border-bottom: 1px solid var(--border); }
        .logo-icon { width: 42px; height: 42px; background: linear-gradient(135deg, var(--primary), var(--secondary)); border-radius: 10px; display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: 13px; color: #04211a; flex-shrink: 0; }
        .logo-text h1 { font-size: 14px; font-weight: 600; }
        .logo-text span { font-size: 11px; color: var(--text-secondary); }

        .timer-container { background: rgba(16, 185, 129, 0.1); border: 1px solid var(--primary); border-radius: 12px; padding: 16px; margin-bottom: 18px; text-align: center; }
        .timer-label { font-size: 12px; color: var(--text-secondary); margin-bottom: 4px; }
        .timer { font-size: 30px; font-weight: 700; font-family: 'Fira Code', monospace; color: var(--primary); }
        .timer.warning { color: var(--warning); animation: pulse 1s infinite; }
        .timer.danger { color: var(--danger); }
        @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.5; } }

        .progress-section { margin-bottom: 18px; }
        .progress-text { display: flex; justify-content: space-between; font-size: 12px; margin-bottom: 8px; color: var(--text-secondary); }
        .progress-bar { height: 8px; background: var(--bg-dark); border-radius: 4px; overflow: hidden; }
        .progress-fill { height: 100%; background: linear-gradient(90deg, var(--primary), var(--secondary)); transition: width 0.3s ease; }

        .nav-label { font-size: 11px; color: var(--text-secondary); margin-bottom: 10px; text-transform: uppercase; letter-spacing: 1px; }
        .question-nav { display: grid; grid-template-columns: repeat(5, 1fr); gap: 6px; margin-bottom: 18px; }
        .nav-q { aspect-ratio: 1; border: 2px solid var(--border); background: var(--bg-dark); border-radius: 6px; color: var(--text-secondary); font-weight: 600; font-size: 12px; cursor: pointer; display: flex; align-items: center; justify-content: center; transition: all 0.2s; }
        .nav-q:hover { border-color: var(--primary); }
        .nav-q.current { background: var(--primary); border-color: var(--primary); color: #04211a; }
        .nav-q.answered { border-color: var(--secondary); color: var(--secondary); }
        .nav-q.current.answered { background: var(--primary); color: #04211a; }

        .sidebar-footer { margin-top: auto; display: flex; flex-direction: column; gap: 10px; }
        .home-link { display: block; text-align: center; color: var(--text-secondary); text-decoration: none; font-size: 12px; padding: 10px 0; border-top: 1px solid var(--border); }
        .home-link:hover { color: var(--primary); }

        /* ---------- Main ---------- */
        .main { margin-left: 290px; padding: 32px; flex: 1; min-width: 0; }

        .question-container { max-width: 900px; margin: 0 auto; }

        .unit-banner {
            background: linear-gradient(135deg, rgba(16,185,129,0.14), rgba(6,182,212,0.07));
            border: 1px solid var(--primary);
            border-radius: 14px;
            padding: 18px 22px;
            margin-bottom: 22px;
        }
        .unit-banner .tag { display: inline-block; font-size: 11px; letter-spacing: 1.2px; text-transform: uppercase; color: var(--secondary); font-weight: 700; margin-bottom: 6px; }
        .unit-banner h1 { font-size: 21px; margin-bottom: 6px; }
        .unit-banner p { font-size: 13px; color: var(--text-secondary); }

        .question-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 18px; }
        .question-num { font-size: 15px; font-weight: 600; color: var(--text-secondary); }
        .marks { padding: 5px 14px; border-radius: 20px; font-size: 12px; font-weight: 700; background: rgba(6,182,212,0.18); color: var(--secondary); white-space: nowrap; }
        .topic-pill { display: inline-block; font-size: 11px; padding: 4px 12px; border-radius: 20px; background: rgba(139,92,246,0.18); color: #a78bfa; font-weight: 600; margin-bottom: 14px; }

        .question-card { background: var(--bg-card); border-radius: 16px; padding: 30px; border: 1px solid var(--border); }
        .question-text { font-size: 16px; line-height: 1.75; color: var(--text-primary); margin-bottom: 22px; }
        .question-text h2 { font-size: 16px; font-weight: 500; }
        .question-text sub, .question-text sup { font-size: 12px; }

        .options { display: flex; flex-direction: column; gap: 12px; }
        .option { background: var(--bg-dark); border: 2px solid var(--border); border-radius: 12px; padding: 18px 22px; cursor: pointer; transition: all 0.2s; display: flex; align-items: flex-start; gap: 16px; }
        .option:hover { border-color: var(--text-secondary); background: var(--bg-hover); }
        .option.selected { border-color: var(--primary); background: rgba(16,185,129,0.1); }
        .option-marker { width: 30px; height: 30px; background: var(--bg-card); border-radius: 8px; display: flex; align-items: center; justify-content: center; font-weight: 600; font-size: 13px; flex-shrink: 0; }
        .option.selected .option-marker { background: var(--primary); color: #04211a; }
        .option-text { font-size: 14.5px; line-height: 1.6; color: var(--text-secondary); }
        .option.selected .option-text { color: var(--text-primary); }

        .input-answer { background: var(--bg-card); border-radius: 12px; padding: 22px; border: 1px solid var(--border); }
        .input-answer label { display: block; font-size: 13px; color: var(--text-secondary); margin-bottom: 10px; font-weight: 500; }
        .input-answer textarea { width: 100%; background: var(--bg-dark); border: 1px solid var(--border); border-radius: 8px; padding: 16px; color: var(--text-primary); font-size: 14.5px; font-family: 'Inter', sans-serif; line-height: 1.7; min-height: 170px; resize: vertical; }
        .input-answer textarea:focus { outline: none; border-color: var(--primary); }
        .input-answer textarea.essay { min-height: 340px; }
        .word-count { font-size: 11px; color: var(--text-muted); text-align: right; margin-top: 8px; }

        .reference-box { background: rgba(245,158,11,0.08); border-left: 3px solid var(--warning); padding: 14px 16px; margin: 16px 0; border-radius: 0 8px 8px 0; }
        .reference-box h4 { font-size: 11px; color: var(--warning); margin-bottom: 6px; text-transform: uppercase; letter-spacing: 0.5px; }
        .reference-box p { font-size: 13.5px; color: var(--text-secondary); line-height: 1.65; }

        .nav-buttons { display: flex; justify-content: space-between; margin-top: 22px; }

        .btn { padding: 13px 26px; border-radius: 10px; font-weight: 600; font-size: 14px; cursor: pointer; border: none; transition: all 0.2s; display: inline-flex; align-items: center; gap: 8px; font-family: 'Inter', sans-serif; }
        .btn-primary { background: var(--primary); color: #04211a; }
        .btn-primary:hover { background: var(--primary-dark); }
        .btn-secondary { background: var(--bg-card); color: var(--text-primary); border: 1px solid var(--border); }
        .btn-secondary:hover { border-color: var(--primary); color: var(--primary); }
        .btn:disabled { opacity: 0.4; cursor: not-allowed; }

        /* ---------- Modal ---------- */
        .modal-overlay { position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0,0,0,0.85); display: flex; align-items: center; justify-content: center; z-index: 1000; opacity: 0; visibility: hidden; transition: all 0.3s; padding: 20px; }
        .modal-overlay.show { opacity: 1; visibility: visible; }
        .modal { background: var(--bg-card); border-radius: 20px; padding: 40px; max-width: 520px; width: 100%; text-align: center; border: 1px solid var(--border); }
        .modal h2 { font-size: 26px; margin-bottom: 12px; }
        .modal-score { font-size: 64px; font-weight: 700; color: var(--primary); margin: 18px 0; font-family: 'Fira Code', monospace; }
        .modal-score-sub { font-size: 13px; color: var(--text-muted); margin-bottom: 22px; }
        .modal p { color: var(--text-secondary); margin-bottom: 28px; }
        .modal-btns { display: flex; gap: 14px; justify-content: center; flex-wrap: wrap; }

        .breakdown { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-bottom: 26px; }
        .breakdown .b { background: var(--bg-dark); border-radius: 10px; padding: 14px 8px; }
        .breakdown .b .n { font-size: 22px; font-weight: 700; }
        .breakdown .b .l { font-size: 11px; color: var(--text-secondary); }
        .breakdown .b.a .n { color: var(--primary); }
        .breakdown .b.i .n { color: var(--danger); }
        .breakdown .b.s .n { color: var(--warning); }

        .review-link { display: inline-block; margin-top: 18px; color: var(--text-muted); font-size: 13px; text-decoration: none; border-bottom: 1px dashed var(--border); }
        .review-link:hover { color: var(--secondary); }

        @media (max-width: 900px) {
            .app-container { flex-direction: column; }
            .sidebar { position: relative; width: 100%; border-right: none; border-bottom: 1px solid var(--border); }
            .main { margin-left: 0; padding: 20px; }
            .question-card { padding: 20px; }
        }
    </style>
</head>
<body>
    <div class="app-container">
        <aside class="sidebar">
            <div class="logo">
                <div class="logo-icon">SCI</div>
                <div class="logo-text">
                    <h1>Kanishka_ISSR</h1>
                    <span>IB MYP Science &middot; M10</span>
                </div>
            </div>

            <div class="timer-container">
                <div class="timer-label">Time Remaining</div>
                <div class="timer" id="timer">90:00</div>
            </div>

            <div class="progress-section">
                <div class="progress-text">
                    <span>Progress</span>
                    <span id="progress-text">0 / 30</span>
                </div>
                <div class="progress-bar">
                    <div class="progress-fill" id="progress-fill" style="width: 0%"></div>
                </div>
            </div>

            <div class="nav-label">Question Navigator</div>
            <div class="question-nav" id="question-nav"></div>

            <div class="sidebar-footer">
                <button class="btn btn-primary" onclick="submitQuiz()">Submit &amp; Finish</button>
                <a href="m10-science-ess-a-study.html" class="btn btn-secondary">Study Material</a>
                <a href="m10-science-ess-a-part2.html" class="btn btn-secondary">→ Part 2</a>
                <a href="/" class="home-link">&larr; Kanishka_ISSR Home</a>
            </div>
        </aside>

        <main class="main">
            <div class="question-container" id="question-container"></div>
        </main>
    </div>

    <div class="modal-overlay" id="modal">
        <div class="modal">
            <h2>Assessment Complete</h2>
            <div class="modal-score" id="modal-score">0%</div>
            <div class="modal-score-sub" id="modal-marks">0 / 0 marks</div>
            <div class="breakdown">
                <div class="b a"><div class="n" id="mcq-count">0</div><div class="l">MCQ correct</div></div>
                <div class="b i"><div class="n" id="wrong-count">0</div><div class="l">Incorrect</div></div>
                <div class="b s"><div class="n" id="skip-count">0</div><div class="l">Skipped</div></div>
            </div>
            <p id="modal-msg">Keep practicing!</p>
            <div class="modal-btns">
                <button class="btn btn-primary" onclick="downloadPDF()">Download Results</button>
                <button class="btn btn-secondary" onclick="showMarkScheme()">Mark Scheme</button>
                <button class="btn btn-secondary" onclick="window.location.href='m10-science-ess-a-study.html'">Study More</button>
            </div>
            <a href="#" class="review-link" onclick="showReview(); return false;">Review every answer</a>
        </div>
    </div>

    <div class="modal-overlay" id="scheme-modal">
        <div class="modal" style="max-width: 760px; text-align: left;">
            <h2 style="text-align:center;">Mark Scheme</h2>
            <div id="scheme-body" style="max-height: 60vh; overflow-y: auto; font-size: 14px; color: var(--text-secondary);"></div>
            <div class="modal-btns" style="margin-top: 24px;">
                <button class="btn btn-secondary" onclick="document.getElementById('scheme-modal').classList.remove('show')">Close</button>
            </div>
        </div>
    </div>

    <script>
        const questions = [
            /* ================= BIODIVERSITY ================= */
            {
                id: 1, type: "mcq", topic: "Biodiversity", marks: 2,
                text: "Under the biological species concept, two organisms belong to the same species when they:",
                options: [
                    "Live in the same habitat",
                    "Can interbreed to produce fertile offspring",
                    "Look morphologically identical",
                    "Share the same genus name"
                ],
                correct: 1,
                explanation: "The biological species concept defines a species as a group of populations whose members can interbreed and produce fertile offspring, and which are reproductively isolated from other groups."
            },
            {
                id: 2, type: "mcq", topic: "Biodiversity", marks: 2,
                text: "Which of the following is written correctly according to the binomial naming system?",
                options: [
                    "homo sapiens",
                    "Homo Sapiens",
                    "<i>Homo sapiens</i>",
                    "<i>SAPIENS HOMO</i>"
                ],
                correct: 2,
                explanation: "The genus name is always capitalised, the specific epithet always lower case, and both are italicised or underlined when handwritten."
            },
            {
                id: 3, type: "mcq", topic: "Biodiversity", marks: 2,
                text: "A large tropical rainforest and a cold Arctic tundra both contain many species. Which statement correctly explains the difference?",
                options: [
                    "The tundra contains more species but they are all microscopic",
                    "The rainforest supports more species, largely because more solar energy is available there",
                    "The tundra is younger so has had more time for speciation",
                    "Cold regions are always poorer in genetic diversity"
                ],
                correct: 1,
                explanation: "Species richness increases toward the equator. The energy hypothesis proposes that greater light and warmth support higher productivity, more niches and therefore more species."
            },
            {
                id: 4, type: "mcq", topic: "Biodiversity", marks: 2,
                text: "On the IUCN Red List, a species is classified as <b>Vulnerable</b> when it:",
                options: [
                    "Is widespread and abundant",
                    "Is very likely to become extinct in the wild in the near future",
                    "Is at very high risk of extinction in the wild",
                    "Has inadequate information to be assessed"
                ],
                correct: 1,
                explanation: "Vulnerable (VU) means a high risk of extinction in the wild. Critically Endangered (CR) is extremely high risk and Endangered (EN) is very high risk. Data Deficient (DD) means inadequate information."
            },
            {
                id: 5, type: "mcq", topic: "Biodiversity", marks: 2,
                text: "Which set of Red List categories is collectively described as <b>threatened</b>?",
                options: [
                    "LC, NT, VU",
                    "VU, EN, CR",
                    "EN, CR, EX",
                    "CR, EW, EX"
                ],
                correct: 1,
                explanation: "\"Threatened\" is defined as Vulnerable, Endangered or Critically Endangered. Extinct and Extinct in the Wild are more severe categories, and LC/NT/NT are not threatened."
            },
            {
                id: 6, type: "mcq", topic: "Biodiversity", marks: 2,
                text: "A community contains 4 species with 25 individuals each. Another community contains 4 species, but one has 97 individuals and the others have 1 each. Which statement is correct?",
                options: [
                    "The first community has greater species richness",
                    "The second community has greater evenness",
                    "Both have identical species richness but the first has greater evenness",
                    "The first community is less diverse in every measure"
                ],
                correct: 2,
                explanation: "Species richness counts species only, so both communities have a richness of 4. The first is far more even, so it has greater species diversity and greater resilience to change."
            },
            {
                id: 7, type: "short", topic: "Biodiversity", marks: 8,
                text: "Scientists estimate there are between 8 and 20 million species of eukaryote on Earth.\n\na) Outline two commonly cited estimates for the total number of species on the planet.\nb) Explain THREE reasons why these estimates vary so widely.",
                placeholder: "a) Estimate 1: [value + who/what estimated it]\nEstimate 2: [value + who/what estimated it]\n\nb) 1. [Reason + explanation]\n2. [Reason + explanation]\n3. [Reason + explanation]",
                keywords: ["8.7 million", "8 million", "20 million", "100 million", "extrapolat", "sample", "undescribed", "statistic", "prokaryot", "virus", "fung", "deep ocean", "bacteri", "cryptic", "species concept", "genetic", "morpholog", "marine", "estimated", "deep sea", "tropical", "canopy", "eukaryote"],
                scheme: [
                    "Two credible estimates: ~8.7 million (Mora et al., statistical extrapolation from soil/canopy samples) and ~20 million; some sources argue up to 100 million including prokaryotes and viruses.",
                    "Reason 1 - undersampling: most habitats (deep ocean, tropical soil, forest canopy) have barely been surveyed, so the sample used for extrapolation is unrepresentative.",
                    "Reason 2 - the species problem: different species definitions (especially for bacteria and fungi, which do not interbreed) give very different counts.",
                    "Reason 3 - cryptic species: many organisms look identical but are genetically distinct, so counting by appearance underestimates.",
                    "Also acceptable: which groups are included (including bacteria/viruses raises the total enormously); unequal taxonomic effort (vertebrates studied, nematodes not)."
                ]
            },
            {
                id: 8, type: "short", topic: "Biodiversity", marks: 8,
                text: "Discuss FOUR current threats to biodiversity. For each one, explain the mechanism by which it reduces species numbers, and give one real-world example.",
                placeholder: "1. Threat: [name]\n   Mechanism: [how it kills or removes species]\n   Example: [place / species]\n\n2. ...\n3. ...\n4. ...",
                keywords: ["habitat", "fragment", "deforest", "agricultur", "overexploit", "overfish", "poach", "invasive", "introduc", "pollut", "climate", "temperature", "bleach", "eutrophic", "biomagnif", "inbreed", "amazon", "coral", "crayfish", "deer", "tiger", "dodo", "endemic", "isolation", "population", "genetic diversity", "coral reef", "boreal", "logging", "rotten", "sewage", "dDT", "microplastic", "hunting", "traffic", "pesticide", "farming", "monoculture", "bleaching", "warming"],
                scheme: [
                    "Habitat loss and fragmentation - destroys habitat and isolates populations, cutting gene flow and causing inbreeding. Example: Amazon deforestation.",
                    "Over-exploitation - individuals are removed faster than reproduction can replace them. Example: overfishing, elephant ivory poaching.",
                    "Invasive species - introduced species often lack natural predators and outcompete or predate natives. Example: signal crayfish in Swedish lakes.",
                    "Pollution - degrades habitat, causes eutrophication and biomagnification of toxins up food chains. Example: nutrient runoff, DDT, microplastics.",
                    "Climate change - habitats shift faster than species can adapt, causing coral bleaching and range loss. Example: Great Barrier Reef bleaching.",
                    "Inbreeding - small isolated populations lose genetic diversity and suffer reduced fitness. Example: northern elephant seals."
                ]
            },
            {
                id: 9, type: "short", topic: "Biodiversity", marks: 6,
                text: "Describe the structure and purpose of the IUCN Red List.",
                placeholder: "PURPOSE:\n[What it is for and who uses it]\n\nSTRUCTURE:\n[Categories / criteria / how categories are assigned]",
                keywords: ["inventory", "assessment", "conservation status", "risk of extinction", "inform", "policy", "prioritis", "protected area", "funding", "manage", "identif", "urgently", "action", "categor", "criteria", "quantitative", "population", "range", "decline", "threatened", "critically endangered", "endangered", "vulnerable", "least concern", "data deficient", "not evaluated", "extinct", "review", "updat", "expert", "compil", "red list", "in danger", "monitor"],
                scheme: [
                    "Purpose: the world's most comprehensive inventory of species conservation status, used to identify which species need urgent action and to inform, prioritise and evaluate conservation policy, funding and protected-area planning.",
                    "Structure: a red list of species at risk of extinction, organised into categories on a scale from Extinct down to Least Concern.",
                    "Categories: EX, EW, CR, EN, VU, NT, LC, DD, NE.",
                    "Each species is assessed against nine quantitative criteria (population size and decline, geographic range, habitat extent and quality, exploitation, population fluctuation, etc.), with sub-criteria.",
                    "\"Threatened\" = CR + EN + VU. Categories are regularly reviewed and updated, so a species can move up or down the list."
                ]
            },
            {
                id: 10, type: "short", topic: "Biodiversity", marks: 6,
                text: "Compare in situ and ex situ conservation as methods of preserving biodiversity, giving an example of each.",
                placeholder: "IN SITU:\n[Definition + advantage + example]\n\nEX SITU:\n[Definition + limitation + example]",
                keywords: ["in situ", "ex situ", "natural habitat", "national park", "reserve", "marine protected", "best", "effective", "wild", "zoo", "botanical garden", "seed bank", "cryo", "captive", "breeding", "limitation", "does not", "range", "genetic diversity", "small population", "coral", "orchid", "condor", "oryx", "behaviour", "natural", "removed from", "england", "england"],
                scheme: [
                    "In situ: protecting species in their natural habitat, so they continue to live, breed and interact in a functioning ecosystem.",
                    "Advantages of in situ: maintains natural behaviours, species interactions and a large enough population to retain genetic diversity; less costly per species.",
                    "Examples of in situ: national parks, wildlife reserves, marine protected areas, protecting the cloud forest of Monteverde, Costa Rica.",
                    "Ex situ: removing organisms from their habitat to protect them - zoos, botanical gardens, seed banks, cryopreservation of gametes.",
                    "Limitations of ex situ: small captive populations lose genetic diversity, individuals may not develop natural behaviours, and it is expensive; it is a last resort for species whose habitat cannot be protected.",
                    "Example of ex situ: the Arabian oryx, extinct in the wild and reintroduced from a captive breeding programme; the California condor."
                ]
            },
            {
                id: 11, type: "short", topic: "Biodiversity", marks: 6,
                text: "Explain TWO different perspectives that people hold on whether species should be conserved, and evaluate each briefly.",
                placeholder: "PERSPECTIVE 1: [whose view + reasoning]\nEVALUATION: [strength or weakness]\n\nPERSPECTIVE 2: [whose view + reasoning]\nEVALUATION: [strength or weakness]",
                keywords: ["conservationist", "intrinsic value", "right to exist", "moral", "ethical", "irreversible", "development", "utilitarian", "economic", "human", "present", "beneficial", "resource", "ecocentric", "ecosystem", "deep ecology", "stewardship", "future generation", "cost", "pollution", "expertise", "food", "medicine", "fisher", "tourism", "jobs", "interdependence"],
                scheme: [
                    "Conservationist view: every species has intrinsic value and a right to exist; extinction is irreversible, so it is morally unacceptable to allow it. Strength: takes the long-term ecological and ethical consequences seriously.",
                    "Development / utilitarian view: resources should be used to benefit present human populations, and some species may be sacrificed if the economic gain justifies it. Strength: recognises real constraints on development and human needs.",
                    "Ecocentric view: value belongs to the whole ecosystem, not to individual species; protecting a functioning ecosystem protects its species automatically.",
                    "Stewardship view: we are caretakers of the planet for future generations, so we owe future humans a viable planet.",
                    "Evaluation: the utilitarian view can be criticised because it values species only instrumentally, and extinction destroys potential value (scientific, medical, aesthetic) that is impossible to recover.",
                    "Evaluation: the conservationist view can be criticised because it may ignore the needs and rights of the people living in biodiversity-rich but poor regions, and conservation can displace local communities."
                ]
            },

            /* ================= ORIGIN OF LIFE ================= */
            {
                id: 12, type: "mcq", topic: "Origin of Life", marks: 2,
                text: "Which statement best describes the composition of the early Earth's atmosphere?",
                options: [
                    "About 21% oxygen, as today",
                    "Rich in carbon dioxide, water vapour, methane and ammonia, with very little free oxygen",

        function seededShuffle(arr, seed) {

            for (let i = a.length - 1; i > 0; i--) {
                s = (s * 9301 + 49297) % 233280;
                const j = Math.floor((s / 233280) * (i + 1));

                const secs = timeRemaining % 60;
                const timerEl = document.getElementById('timer');
                timerEl.textContent = `${mins.toString().padStart(2, '0')}:${secs.toString().padStart(2, '0')}`;
                if (timeRemaining <= 300) { timerEl.classList.remove('warning'); timerEl.classList.add('danger'); }
                else if (timeRemaining <= 600) timerEl.classList.add('warning');
                if (timeRemaining <= 0) { clearInterval(timerInterval); submitQuiz(); }
            }, 1000);
        }

        function renderQuestionNav() {
            const nav = document.getElementById('question-nav');
            nav.innerHTML = questions.map((q, i) => {
                const answered = answers[q.id] !== undefined && answers[q.id] !== null;
                return `<div class="nav-q ${answered ? 'answered' : ''}" onclick="showQuestion(${i})">${i + 1}</div>`;
            }).join('');
            document.querySelectorAll('.nav-q').forEach((el, i) => el.classList.toggle('current', i === currentQuestion));
        }

        function updateProgress() {
            const answered = questions.filter(q => answers[q.id] !== undefined && answers[q.id] !== null).length;
            document.getElementById('progress-text').textContent = `${answered} / ${questions.length}`;
            document.getElementById('progress-fill').style.width = `${(answered / questions.length) * 100}%`;
        }

        function showQuestion(index) {
            currentQuestion = index;
            const q = questions[index];
            const container = document.getElementById('question-container');

            const head = `
                <div class="unit-banner">
                    <div class="tag">ESS Unit A &middot; Part 1</div>
                    <h1>${q.topic}</h1>
                    <p>Biodiversity &middot; Origin and development of life on Earth &middot; Measuring populations</p>
                </div>
                <div class="question-card">
                    <span class="topic-pill">${q.topic}</span>
                    <div class="question-header">
                        <div class="question-num">Question <strong>${q.id}</strong> of ${questions.length}</div>
                        <div class="marks">${q.marks} marks</div>
                    </div>
                    <div class="question-text"><h2>${q.text.replace(/\n/g, '<br>')}</h2></div>
            `;

            let body = '';

            if (q.type === 'mcq') {
                body = `<div class="options">` + q._opts.map((opt, i) => `
                    <div class="option ${answers[q.id] === i ? 'selected' : ''}" onclick="selectOption(${q.id}, ${i})">
                        <div class="option-marker">${String.fromCharCode(65 + i)}</div>
                        <div class="option-text">${opt}</div>
                    </div>`).join('') + `</div>`;
            } else if (q.type === 'short') {
                body = `
                    <div class="reference-box">
                        <h4>How to earn full marks</h4>
                        <p>Answer every part separately, use scientific terminology, and support each point with a specific example or piece of data. This question is marked against a ${q.marks}-mark scheme with ${q.scheme.length} required points.</p>
                    </div>
                    <div class="input-answer">
                        <label>Your answer</label>
                        <textarea id="answer-${q.id}" placeholder="${q.placeholder}" oninput="saveAnswer(${q.id}, this.value)">${answers[q.id] || ''}</textarea>
                        <div class="word-count" id="wc-${q.id}">${(answers[q.id] || '').length} characters</div>
                    </div>`;
            } else if (q.type === 'essay') {
                body = `
                    <div class="reference-box">
                        <h4>Structure</h4>
                        <p>Write a paragraph for each lettered part (a-e). Use a comparison structure for parts (b) and (c): state the position for past events, then the position for the present, then an explicit point of comparison. Your conclusion should evaluate, not merely describe.</p>
                    </div>
                    <div class="input-answer">
                        <label>Your response (400-500 words recommended)</label>
                        <textarea id="answer-${q.id}" class="essay" placeholder="${q.placeholder}" oninput="saveAnswer(${q.id}, this.value)">${answers[q.id] || ''}</textarea>
                        <div class="word-count" id="wc-${q.id}">${(answers[q.id] || '').length} characters</div>
                    </div>`;
            }

            const nav = `
                </div>
                <div class="nav-buttons">
                    <button class="btn btn-secondary" onclick="prevQuestion()" ${index === 0 ? 'disabled' : ''}>&larr; Previous</button>
                    <button class="btn btn-primary" onclick="nextQuestion()">${index === questions.length - 1 ? 'Submit & Finish' : 'Next &rarr;'}</button>
                </div>`;

            container.innerHTML = head + body + nav;
            renderQuestionNav();
        }

        function selectOption(qId, optIndex) {
            answers[qId] = optIndex;
            updateProgress();
            showQuestion(currentQuestion);
        }

        function saveAnswer(qId, value) {
            answers[qId] = value;
            const wc = document.getElementById('wc-' + qId);
            if (wc) wc.textContent = `${value.length} characters`;
            updateProgress();
            renderQuestionNav();
        }

        function prevQuestion() {
            if (currentQuestion > 0) { currentQuestion--; showQuestion(currentQuestion); }
        }

        function nextQuestion() {
            if (currentQuestion < questions.length - 1) {
                currentQuestion++;
                showQuestion(currentQuestion);
                window.scrollTo({ top: 0, behavior: 'smooth' });
            } else {
                const unanswered = questions.filter(q => answers[q.id] === undefined || answers[q.id] === null).length;
                const msg = unanswered > 0
                    ? `You have ${unanswered} unanswered question(s). Submit anyway?`
                    : 'You have answered every question. Submit now?';
                if (confirm(msg)) submitQuiz();
            }
        }

        function scoreQuestion(q) {
            const a = answers[q.id];
            if (a === undefined || a === null) return 0;
            if (q.type === 'mcq') return a === q._correct ? q.marks : 0;
            if (typeof a !== 'string' || a.trim().length < 20) return 0;
            // Self-check estimate: one distinct key concept earns one mark, so a
            // full answer needs at least `q.marks` different key terms present.
            const text = a.toLowerCase();
            let hits = 0;
            q.keywords.forEach(kw => { if (text.includes(kw.toLowerCase())) hits++; });
            return Math.min(q.marks, hits);
        }

        function buildResults() {
            let score = 0, max = 0, mcqTotal = 0, mcqCorrect = 0, wrong = 0, skipped = 0;
            const byTopic = {};
            questions.forEach(q => {
                const s = scoreQuestion(q);
                score += s; max += q.marks;
                if (q.type === 'mcq') {
                    mcqTotal++; if (answers[q.id] === q._correct) mcqCorrect++;
                }
                if (answers[q.id] === undefined || answers[q.id] === null) skipped++; else if (s < q.marks) wrong++;
                if (!byTopic[q.topic]) byTopic[q.topic] = { score: 0, max: 0 };
                byTopic[q.topic].score += s; byTopic[q.topic].max += q.marks;
            });
            return { score, max, mcqTotal, mcqCorrect, wrong, skipped, byTopic };
        }

        function submitQuiz() {
            if (submitted) return;
            submitted = true;
            clearInterval(timerInterval);
            const r = buildResults();
            const pct = Math.round((r.score / r.max) * 100);

            document.getElementById('modal-score').textContent = `${pct}%`;
            document.getElementById('modal-marks').textContent = `${r.score} / ${r.max} marks`;
            document.getElementById('mcq-count').textContent = `${r.mcqCorrect}/${r.mcqTotal}`;
            document.getElementById('wrong-count').textContent = r.wrong;
            document.getElementById('skip-count').textContent = r.skipped;

            let msg = 'Keep practicing - revisit the study material and try again.';
            if (pct >= 85) msg = 'Outstanding! You have a strong grasp of ESS Unit A.';
            else if (pct >= 70) msg = 'Strong work. Check the mark scheme for the parts you lost.';
            else if (pct >= 55) msg = 'Good start. Focus on the sections with the lowest scores below.';
            else msg = 'Revisit the study material, then retake this part.';
            document.getElementById('modal-msg').textContent = msg;

            document.getElementById('modal').classList.add('show');
            localStorage.setItem('kanimath_m10_sci_part1', JSON.stringify({
                score: r.score, max: r.max, percentage: pct,
                date: new Date().toISOString(), answers
            }));
        }

        function showMarkScheme() {
            const html = questions.filter(q => q.scheme && q.scheme.length).map(q => `
                <div style="margin-bottom: 22px; padding-bottom: 16px; border-bottom: 1px solid var(--border);">
                    <div style="font-weight: 700; color: var(--primary); margin-bottom: 6px;">Q${q.id} &middot; ${q.topic} &middot; ${q.marks} marks</div>
                    <div style="margin-bottom: 8px; font-size: 13px;">${q.text.substring(0, 150)}${q.text.length > 150 ? '...' : ''}</div>
                    <ol style="margin-left: 18px;">
                        ${q.scheme.map(s => `<li style="margin-bottom: 5px; font-size: 13px; line-height: 1.6;">${s}</li>`).join('')}
                    </ol>
                </div>`).join('');
            document.getElementById('scheme-body').innerHTML = html;
            document.getElementById('scheme-modal').classList.add('show');
        }

        function showReview() {
            const rows = questions.map(q => {
                const a = answers[q.id];
                const s = scoreQuestion(q);
                let yourAnswer, correct;
                if (q.type === 'mcq') {
                    yourAnswer = a === undefined || a === null ? '<i>Not answered</i>' : `${String.fromCharCode(65 + a)}: ${q._opts[a]}`;
                    correct = `${String.fromCharCode(65 + q._correct)}: ${q._opts[q._correct]}`;
                } else {
                    yourAnswer = a ? a.replace(/</g, '&lt;').substring(0, 300) : '<i>Not answered</i>';
                    correct = `<b>Scheme:</b> ${q.scheme.join(' ')}`;
                }
                const col = s === q.marks ? 'var(--primary)' : s > 0 ? 'var(--warning)' : 'var(--danger)';
                return `<div style="padding: 14px 0; border-bottom: 1px solid var(--border);">
                    <div style="display:flex; justify-content:space-between; margin-bottom: 6px;">
                        <b style="color: var(--text-primary);">Q${q.id} &middot; ${q.topic}</b>
                        <span style="color:${col}; font-weight:700;">${s} / ${q.marks}</span>
                    </div>
                    <div style="font-size: 13px; margin-bottom: 4px;"><b>Your answer:</b> ${yourAnswer}</div>
                    <div style="font-size: 13px;">${correct}</div>
                    ${q.explanation ? `<div style="font-size: 13px; color: var(--secondary); margin-top: 4px;">${q.explanation}</div>` : ''}
                </div>`;
            }).join('');

            const r = buildResults();
            const topicRows = Object.entries(r.byTopic).map(([t, v]) => `
                <div style="display:flex; justify-content:space-between; padding: 8px 0; border-bottom: 1px solid var(--border); font-size: 14px;">
                    <span>${t}</span><span style="font-family: 'Fira Code', monospace;">${v.score} / ${v.max}</span>
                </div>`).join('');

            document.getElementById('scheme-body').innerHTML = `
                <h3 style="color: var(--primary); margin-bottom: 12px; font-size: 15px;">Score by topic</h3>
                ${topicRows}
                <h3 style="color: var(--primary); margin: 24px 0 8px; font-size: 15px;">Every answer</h3>
                ${rows}`;
            document.getElementById('scheme-modal').classList.add('show');
        }

        function downloadPDF() {
            const { jsPDF } = window.jspdf;
            const doc = new jsPDF();
            const r = buildResults();
            const pct = Math.round((r.score / r.max) * 100);

            doc.setFontSize(18);
            doc.setTextColor(16, 185, 129);
            doc.text('Kanishka_ISSR - IB MYP Science (M10)', 20, 20);
            doc.setFontSize(14);
            doc.setTextColor(60);
            doc.text('ESS Unit A: Evolution and the Origin of Life - Part 1', 20, 29);
            doc.setFontSize(10);
            doc.setTextColor(120);
            doc.text(`${new Date().toLocaleDateString()}  |  Biodiversity, Origin of Life, Measuring Populations`, 20, 36);

            doc.setFontSize(34);
            doc.setTextColor(16, 185, 129);
            doc.text(`${pct}%`, 20, 56);
            doc.setFontSize(11);
            doc.setTextColor(60);
            doc.text(`Total: ${r.score} / ${r.max} marks`, 62, 48);
            doc.text(`MCQ correct: ${r.mcqCorrect}/${r.mcqTotal}   Partially correct: ${r.wrong}   Skipped: ${r.skipped}`, 62, 56);

            let y = 72;
            doc.setFontSize(12);
            doc.setTextColor(16, 185, 129);
            doc.text('Score by topic', 20, y);
            y += 7;
            doc.setFontSize(9);
            Object.entries(r.byTopic).forEach(([t, v]) => {
                doc.setTextColor(80);
                doc.text(`${t}: ${v.score} / ${v.max} marks`, 20, y);
                y += 6;
            });

            y += 6;
            doc.setFontSize(12);
            doc.setTextColor(16, 185, 129);
            doc.text('Question results', 20, y);
            y += 7;

            questions.forEach((q) => {
                if (y > 265) { doc.addPage(); y = 20; }
                const s = scoreQuestion(q);
                doc.setFontSize(9);
                doc.setTextColor(s === q.marks ? 16 : s > 0 ? 200 : 220, s === q.marks ? 185 : s > 0 ? 150 : 68, s === q.marks ? 129 : s > 0 ? 20 : 68);
                doc.text(`Q${q.id} [${q.topic}] ${s}/${q.marks} marks`, 20, y);
                doc.setTextColor(110);
                const a = answers[q.id];
                const summary = q.type === 'mcq'
                    ? (a === undefined || a === null ? 'not answered' : `chose ${String.fromCharCode(65 + a)}`)
                    : (a ? `${a.replace(/\s+/g, ' ').substring(0, 70)}...` : 'not answered');
                doc.text(`Your answer: ${summary}`, 105, y);
                y += 6;
                if (y > 265) { doc.addPage(); y = 20; }
                doc.setTextColor(90);
                if (q.type === 'mcq') {
                    doc.text(`Correct: ${q.explanation.substring(0, 100)}`, 105, y);
                } else {
                    doc.text(`Scheme: ${q.scheme[0].replace(/<[^>]*>/g, '').substring(0, 100)}`, 105, y);
                }
                y += 8;
            });

            doc.setFontSize(8);
            doc.setTextColor(150);
            doc.text('Generated by Kanishka_ISSR', 105, 285, { align: 'center' });
            doc.save('M10_Science_ESS_Unit_A_Part1.pdf');
        }

        init();
    </script>
</body>
</html>
