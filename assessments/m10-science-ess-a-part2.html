<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IB MYP Science - ESS Unit A Part 2 (M10)</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Fira+Code&display=swap" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <style>
        :root {
            --primary: #10b981;
            --primary-dark: #059669;
            --secondary: #06b6d4;
            --danger: #ef4444;
            --warning: #f59e0b;
            --bg-dark: #0f172a;
            --bg-card: #1e293b;
            --bg-hover: #334155;
            --text-primary: #f8fafc;
            --text-secondary: #94a3b8;
            --text-muted: #64748b;
            --border: #475569;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Inter', sans-serif;
            background: var(--bg-dark);
            color: var(--text-primary);
            min-height: 100vh;
        }

        .app-container { display: flex; min-height: 100vh; }

        .sidebar {
            width: 290px;
            background: var(--bg-card);
            border-right: 1px solid var(--border);
            padding: 20px;
            display: flex;
            flex-direction: column;
            position: fixed;
            top: 0; left: 0; bottom: 0;
            overflow-y: auto;
        }

        .logo { display: flex; align-items: center; gap: 12px; margin-bottom: 20px; padding-bottom: 16px; border-bottom: 1px solid var(--border); }
        .logo-icon { width: 42px; height: 42px; background: linear-gradient(135deg, var(--secondary), var(--primary)); border-radius: 10px; display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: 13px; color: #04211a; flex-shrink: 0; }
        .logo-text h1 { font-size: 14px; font-weight: 600; }
        .logo-text span { font-size: 11px; color: var(--text-secondary); }

        .timer-container { background: rgba(6,182,212,0.1); border: 1px solid var(--secondary); border-radius: 12px; padding: 16px; margin-bottom: 18px; text-align: center; }
        .timer-label { font-size: 12px; color: var(--text-secondary); margin-bottom: 4px; }
        .timer { font-size: 30px; font-weight: 700; font-family: 'Fira Code', monospace; color: var(--secondary); }
        .timer.warning { color: var(--warning); animation: pulse 1s infinite; }
        .timer.danger { color: var(--danger); }
        @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.5; } }

        .progress-section { margin-bottom: 18px; }
        .progress-text { display: flex; justify-content: space-between; font-size: 12px; margin-bottom: 8px; color: var(--text-secondary); }
        .progress-bar { height: 8px; background: var(--bg-dark); border-radius: 4px; overflow: hidden; }
        .progress-fill { height: 100%; background: linear-gradient(90deg, var(--secondary), var(--primary)); transition: width 0.3s ease; }

        .nav-label { font-size: 11px; color: var(--text-secondary); margin-bottom: 10px; text-transform: uppercase; letter-spacing: 1px; }
        .question-nav { display: grid; grid-template-columns: repeat(5, 1fr); gap: 6px; margin-bottom: 18px; }
        .nav-q { aspect-ratio: 1; border: 2px solid var(--border); background: var(--bg-dark); border-radius: 6px; color: var(--text-secondary); font-weight: 600; font-size: 12px; cursor: pointer; display: flex; align-items: center; justify-content: center; transition: all 0.2s; }
        .nav-q:hover { border-color: var(--primary); }
        .nav-q.current { background: var(--primary); border-color: var(--primary); color: #04211a; }
        .nav-q.answered { border-color: var(--secondary); color: var(--secondary); }
        .nav-q.current.answered { background: var(--primary); color: #04211a; }

        .sidebar-footer { margin-top: auto; display: flex; flex-direction: column; gap: 10px; }
        .home-link { display: block; text-align: center; color: var(--text-secondary); text-decoration: none; font-size: 12px; padding: 10px 0; border-top: 1px solid var(--border); }
        .home-link:hover { color: var(--primary); }

        .main { margin-left: 290px; padding: 32px; flex: 1; min-width: 0; }
        .question-container { max-width: 900px; margin: 0 auto; }

        .unit-banner {
            background: linear-gradient(135deg, rgba(6,182,212,0.14), rgba(16,185,129,0.07));
            border: 1px solid var(--secondary);
            border-radius: 14px;
            padding: 18px 22px;
            margin-bottom: 22px;
        }
        .unit-banner .tag { display: inline-block; font-size: 11px; letter-spacing: 1.2px; text-transform: uppercase; color: var(--primary); font-weight: 700; margin-bottom: 6px; }
        .unit-banner h1 { font-size: 21px; margin-bottom: 6px; }
        .unit-banner p { font-size: 13px; color: var(--text-secondary); }

        .question-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 18px; }
        .question-num { font-size: 15px; font-weight: 600; color: var(--text-secondary); }
        .marks { padding: 5px 14px; border-radius: 20px; font-size: 12px; font-weight: 700; background: rgba(16,185,129,0.18); color: var(--primary); white-space: nowrap; }
        .topic-pill { display: inline-block; font-size: 11px; padding: 4px 12px; border-radius: 20px; background: rgba(139,92,246,0.18); color: #a78bfa; font-weight: 600; margin-bottom: 14px; }

        .question-card { background: var(--bg-card); border-radius: 16px; padding: 30px; border: 1px solid var(--border); }
        .question-text { font-size: 16px; line-height: 1.75; color: var(--text-primary); margin-bottom: 22px; }
        .question-text h2 { font-size: 16px; font-weight: 500; }

        .options { display: flex; flex-direction: column; gap: 12px; }
        .option { background: var(--bg-dark); border: 2px solid var(--border); border-radius: 12px; padding: 18px 22px; cursor: pointer; transition: all 0.2s; display: flex; align-items: flex-start; gap: 16px; }
        .option:hover { border-color: var(--text-secondary); background: var(--bg-hover); }
        .option.selected { border-color: var(--primary); background: rgba(16,185,129,0.1); }
        .option-marker { width: 30px; height: 30px; background: var(--bg-card); border-radius: 8px; display: flex; align-items: center; justify-content: center; font-weight: 600; font-size: 13px; flex-shrink: 0; }
        .option.selected .option-marker { background: var(--primary); color: #04211a; }
        .option-text { font-size: 14.5px; line-height: 1.6; color: var(--text-secondary); }
        .option.selected .option-text { color: var(--text-primary); }

        /* ---------- Data tables inside questions ---------- */
        .data-table { width: 100%; border-collapse: collapse; margin: 18px 0; font-size: 13px; font-family: 'Fira Code', monospace; }
        .data-table th { background: var(--bg-dark); color: var(--secondary); padding: 9px 10px; text-align: left; font-size: 11px; text-transform: uppercase; letter-spacing: 0.5px; border-bottom: 1px solid var(--border); }
        .data-table td { padding: 8px 10px; border-bottom: 1px solid var(--border); color: var(--text-secondary); }
        .data-table .hl { color: var(--primary); font-weight: 600; }

        .ascii-chart { font-family: 'Fira Code', monospace; font-size: 12.5px; line-height: 1.5; background: var(--bg-dark); border: 1px solid var(--border); border-radius: 10px; padding: 20px; margin: 18px 0; overflow-x: auto; color: var(--text-secondary); }
        .ascii-chart .ax { color: var(--text-muted); }
        .ascii-chart .lbl { color: var(--secondary); }
        .ascii-chart .bar { color: var(--primary); }

        .input-answer { background: var(--bg-card); border-radius: 12px; padding: 22px; border: 1px solid var(--border); }
        .input-answer label { display: block; font-size: 13px; color: var(--text-secondary); margin-bottom: 10px; font-weight: 500; }
        .input-answer textarea { width: 100%; background: var(--bg-dark); border: 1px solid var(--border); border-radius: 8px; padding: 16px; color: var(--text-primary); font-size: 14.5px; font-family: 'Inter', sans-serif; line-height: 1.7; min-height: 170px; resize: vertical; }
        .input-answer textarea:focus { outline: none; border-color: var(--primary); }
        .input-answer textarea.essay { min-height: 340px; }
        .word-count { font-size: 11px; color: var(--text-muted); text-align: right; margin-top: 8px; }

        .reference-box { background: rgba(245,158,11,0.08); border-left: 3px solid var(--warning); padding: 14px 16px; margin: 16px 0; border-radius: 0 8px 8px 0; }
        .reference-box h4 { font-size: 11px; color: var(--warning); margin-bottom: 6px; text-transform: uppercase; letter-spacing: 0.5px; }
        .reference-box p { font-size: 13.5px; color: var(--text-secondary); line-height: 1.65; }
        .reference-box p strong { color: var(--primary); }

        .nav-buttons { display: flex; justify-content: space-between; margin-top: 22px; }

        .btn { padding: 13px 26px; border-radius: 10px; font-weight: 600; font-size: 14px; cursor: pointer; border: none; transition: all 0.2s; display: inline-flex; align-items: center; gap: 8px; font-family: 'Inter', sans-serif; }
        .btn-primary { background: var(--primary); color: #04211a; }
        .btn-primary:hover { background: var(--primary-dark); }
        .btn-secondary { background: var(--bg-card); color: var(--text-primary); border: 1px solid var(--border); }
        .btn-secondary:hover { border-color: var(--primary); color: var(--primary); }
        .btn:disabled { opacity: 0.4; cursor: not-allowed; }

        .modal-overlay { position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0,0,0,0.85); display: flex; align-items: center; justify-content: center; z-index: 1000; opacity: 0; visibility: hidden; transition: all 0.3s; padding: 20px; }
        .modal-overlay.show { opacity: 1; visibility: visible; }
        .modal { background: var(--bg-card); border-radius: 20px; padding: 38px; max-width: 520px; width: 100%; text-align: center; border: 1px solid var(--border); }
        .modal h2 { font-size: 26px; margin-bottom: 12px; }
        .modal-score { font-size: 64px; font-weight: 700; color: var(--primary); margin: 18px 0; font-family: 'Fira Code', monospace; }
        .modal-score-sub { font-size: 13px; color: var(--text-muted); margin-bottom: 22px; }
        .modal p { color: var(--text-secondary); margin-bottom: 28px; }
        .modal-btns { display: flex; gap: 12px; justify-content: center; flex-wrap: wrap; }

        .breakdown { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-bottom: 26px; }
        .breakdown .b { background: var(--bg-dark); border-radius: 10px; padding: 14px 8px; }
        .breakdown .b .n { font-size: 22px; font-weight: 700; }
        .breakdown .b .l { font-size: 11px; color: var(--text-secondary); }
        .breakdown .b.a .n { color: var(--primary); }
        .breakdown .b.i .n { color: var(--danger); }
        .breakdown .b.s .n { color: var(--warning); }

        .review-link { display: inline-block; margin-top: 18px; color: var(--text-muted); font-size: 13px; text-decoration: none; border-bottom: 1px dashed var(--border); }
        .review-link:hover { color: var(--secondary); }

        @media (max-width: 900px) {
            .app-container { flex-direction: column; }
            .sidebar { position: relative; width: 100%; border-right: none; border-bottom: 1px solid var(--border); }
            .main { margin-left: 0; padding: 20px; }
            .question-card { padding: 20px; }
        }
    </style>
</head>

                <div class="logo-icon">SCI</div>

    </div>

    <div class="modal-overlay" id="scheme-modal">
        <div class="modal" style="max-width: 760px; text-align: left;">
            <h2 style="text-align:center;">Mark Scheme</h2>
            <div id="scheme-body" style="max-height: 60vh; overflow-y: auto; font-size: 14px; color: var(--text-secondary);"></div>
            <div class="modal-btns" style="margin-top: 24px;">
                <button class="btn btn-secondary" onclick="document.getElementById('scheme-modal').classList.remove('show')">Close</button>
            </div>
        </div>
    </div>

    <script>
        const questions = [
            /* ================= EVOLUTION ================= */
            {
                id: 1, type: "mcq", topic: "Evolution", marks: 2,
                text: "Which statement about natural selection is <b>correct</b>?",
                options: [
                    "Mutations occur because an organism needs them in order to survive",
                    "It acts only on the heritable part of a difference between individuals",
                    "It always produces a perfectly designed organism",
                    "It increases variation within a population"
                ],
                correct: 1,
                explanation: "Selection acts on the phenotype, but only the heritable (genetic) component is passed on, so evolution is a change in allele frequency. Mutations are random with respect to need, and selection usually reduces variation within a population while increasing differences between populations."
            },
            {
                id: 2, type: "mcq", topic: "Evolution", marks: 2,
                text: "A dolphin's flipper and a shark's fin are both used for swimming. How should they be classified?",
                options: [
                    "Homologous structures - both inherited from a common ancestor",
                    "Analogous structures - same function, different evolutionary origin",
                    "Analogous structures - both inherited from a common swimming ancestor",
                    "Homologous structures - they share the same function"
                ],
                correct: 1,
                explanation: "They are analogous: both function as control surfaces for swimming, but the dolphin's flipper contains the same bones as a human arm (humerus, radius, ulna, digits), whereas a shark's fin has no bone structure at all. Convergent evolution."
            },
            {
                id: 3, type: "mcq", topic: "Evolution", marks: 2,
                text: "Which is the best example of <b>divergent</b> evolution?",
                options: [
                    "Wings in birds and insects",
                    "The pentadactyl limb in humans, whales, bats and cats",
                    "The streamlined body shape of a shark and a dolphin",
                    "Eyes in humans and octopuses"
                ],
                correct: 1,
                explanation: "Divergent evolution involves related species evolving apart from a shared ancestor while retaining the same underlying structure - the pentadactyl limb. The other three are all cases of convergent evolution producing analogous structures."
            },
            {
                id: 4, type: "mcq", topic: "Evolution", marks: 2,
                text: "The reduced pelvic bones and hind limbs found inside modern whales are best described as:",
                options: [
                    "Analogous structures, because they no longer function",
                    "Vestigial structures inherited from a walking ancestor",
                    "Transitional forms that are still evolving",
                    "Evidence of convergent evolution with fish"
                ],
                correct: 1,
                explanation: "Vestigial structures are reduced features inherited from an ancestor in which they were fully functional. The whale's hind limbs show the ancestor walked. They are homologous with the hind limbs of four-legged mammals, not analogous."
            },
            {
                id: 5, type: "mcq", topic: "Evolution", marks: 2,
                text: "<i>Pakicetus</i>, <i>Ambulocetus</i> and <i>Dorudon</i> are described as transitional forms because they:",
                options: [
                    "Are the direct ancestors of modern whales",
                    "Show a mixture of features of two major groups, linking land mammals to fully aquatic whales",
                    "Are the oldest fossils ever discovered",
                    "Belong to a species that still exists today"
                ],
                correct: 1,
                explanation: "Transitional forms have a mix of ancestral and derived features - for example, legs plus aquatic adaptations - which demonstrates the gradual path between groups. They are not themselves necessarily direct ancestors, and they are all extinct."
            },
            {
                id: 6, type: "mcq", topic: "Evolution", marks: 2,
                text: "On a phylogenetic tree, which pair of organisms is <b>most closely related</b>?",
                options: [
                    "Whales and sharks",
                    "Whales and hippos",
                    "Whales and fish",
                    "Whales and birds"
                ],
                correct: 1,
                explanation: "Relatedness is read from the most recent common node, not from how far apart organisms appear on the page. Whales and hippos share a much more recent common ancestor with each other than either does with sharks, fish or birds - which is why whales are classified as artiodactyls, not fish."
            },
            {
                id: 7, type: "short", topic: "Evolution", marks: 8,
                text: "CASE STUDY: Industrial melanism in the peppered moth\n\nBefore the 1800s, light-coloured peppered moths were common in soot-darkened English woodlands because they were camouflaged from birds. In the 1800s air quality improved, lichens returned to the tree bark, dark moths became better camouflaged and their frequency rose sharply. In the 1950s, when air pollution fell again, light moths increased once more.\n\nUsing the <b>VIDA</b> model, explain how this change in the peppered moth population came about, and identify the <b>selective pressure</b>.",
                placeholder: "SELECTIVE PRESSURE:\n[The environmental factor and who it acts on]\n\nV - VARIATION:\n[What differed between individuals and how]\n\nI - INHERITANCE:\n[Why the difference was passed on]\n\nD - DIFFERENTIAL SURVIVAL:\n[What happened to the moths with each colour]\n\nA - ADAPTATION:\n[The change in allele frequency over generations]",
                keywords: ["variation", "inherit", "heritable", "gene", "allele", "differential survival", "reproduce", "offspring", "adaptation", "allele frequency", "change", "generation", "selective pressure", "predation", "bird", "camouflage", "soot", "pollution", "lichen", "bark", "dark", "light", "colour", "melanism", "survive", "reproduce", "more", "natural selection", "direction", "environment", "selective advantage", "favour", "disadvantage", "not need", "random", "mutation"],
                scheme: [
                    "Selective pressure: visual predation by birds. Birds selectively remove whichever morph is more visible against the tree bark, so the background colour of the bark is the selective agent.",
                    "V - Variation: the population already contained variation in body colour (light and dark morphs), originally produced by random mutation.",
                    "I - Inheritance: colour is genetically determined and heritable, so moths passed their colour to their offspring.",
                    "D - Differential survival: in polluted woods, dark moths were better camouflaged on soot-darkened bark, so birds ate fewer of them; they survived longer and reproduced more. Light moths were eaten more often.",
                    "A - Adaptation: over generations, dark moths left more offspring, so the frequency of the dark allele rose and the population shifted. When pollution declined and lichens returned, the reverse happened - the process is reversible, which supports natural selection rather than a directed change.",
                    "Key evaluation point: moths did not change colour because they needed to. Mutation is random; selection simply favoured the variant that happened to be hidden in polluted conditions."
                ]
            },
            {
                id: 8, type: "short", topic: "Evolution", marks: 6,
                text: "Explain how homologous structures provide evidence that groups of organisms share a common ancestor. Use the pentadactyl limb as your example.",
                placeholder: "STRUCTURE:\n[The underlying bone plan and what it is called]\n\nEVIDENCE:\n[Which organisms share it, and what it is used for in each]\n\nCONCLUSION:\n[What this implies about ancestry]",
                keywords: ["homolog", "same structure", "same origin", "same basic", "bone plan", "pentadactyl", "humerus", "radius", "ulna", "carpal", "metacarpal", "phalange", "digit", "five digit", "divergent", "common ancestor", "inherit", "differ", "function", "human hand", "whale flipper", "bat wing", "cat paw", "different function", "same origin", "evidence", "not", "coincidence", "designed", "bird", "lizard"],
                scheme: [
                    "Homologous structures share the same basic structure and evolutionary origin, even if they perform different functions.",
                    "The pentadactyl (five-digit) limb has the same arrangement of bones in every case: a single upper bone (humerus), two lower bones (radius and ulna), wrist bones (carpals), metacarpals and phalanges (digits).",
                    "These identical bones are found in a human hand (grasping), a cat's paw (walking), a bat's wing (flying) and a whale's flipper (swimming) - identical structures serving completely different functions.",
                    "The most parsimonious explanation is that all four inherited the limb from a single common ancestor and that it was subsequently modified by natural selection for different functions. This is divergent evolution.",
                    "Evaluation point: it would be an extraordinary coincidence for such a complex and specific arrangement of bones to arise independently in four unrelated groups, so homology is strong evidence of common ancestry. Contrast with analogous structures, which achieve the same function but have a different origin."
                ]
            },
            {
                id: 9, type: "short", topic: "Evolution", marks: 6,
                text: "Explain how convergent evolution produces analogous structures in groups of organisms that are not closely related. Give TWO examples.",
                placeholder: "PROCESS:\n[How unrelated groups come to share a feature]\n\nEXAMPLE 1:\n[Organisms, feature, why they needed it]\n\nEXAMPLE 2:\n[Organisms, feature, why they needed it]\n\nKEY IDEA:\n[How you can tell the structure is not inherited]",
                keywords: ["convergent", "analogous", "similar", "unrelated", "distantly related", "not closely related", "different", "same function", "same environment", "similar condition", "pressure", "selective pressure", "independently", "separate", "evolve", "wing", "bird", "insect", "bat", "flight", "air", "streamlined", "shark", "dolphin", "fish", "ichthyosaur", "eye", "human", "octopus", "camera", "parallel", "not inherited", "no common ancestor", "convergence"],
                scheme: [
                    "Convergent evolution occurs when distantly related groups independently evolve similar features because they are exposed to the same selective pressure in similar environments.",
                    "Because the groups are not closely related, the shared feature cannot have been inherited from a recent common ancestor; it evolved twice, independently.",
                    "Example 1 - flight: birds, insects and bats all evolved wings, but a bird's wing is a modified forelimb with feathers, a bat's is a modified hand with skin stretched over elongated fingers, and an insect's wing is an outgrowth of the exoskeleton with no bone at all. The shared feature is the ability to fly.",
                    "Example 2 - streamlined shape: a shark (fish), a dolphin (mammal) and an ichthyosaur (marine reptile) all have a smooth, torpedo-shaped body, because this reduces drag in water.",
                    "Also acceptable: the camera eye of humans and octopuses, which evolved separately in vertebrates and cephalopod molluscs.",
                    "Key distinguishing idea: analogous structures share function but not origin, so they cannot be used as evidence of common ancestry in the way homologous structures can."
                ]
            },
            {
                id: 10, type: "short", topic: "Evolution", marks: 8,
                text: "Explain how the fossil record provides evidence about evolution, using the whale case study. Identify at least FOUR features of the fossil whales that show evolutionary change, and name the sequence of transitional forms.",
                placeholder: "SEQUENCE:\n[Ambulocetus -> Basilosaurus -> Dorudon -> modern whale, with what changed at each step]\n\nEVIDENCE FROM FEATURES:\n1. [Feature + what it shows]\n2. ...\n3. ...\n4. ...\n\nCONCLUSION:\n[What the sequence demonstrates]",

        function seededShuffle(arr, seed) {
            const a = arr.slice();
            let s = seed;
            for (let i = a.length - 1; i > 0; i--) {
                s = (s * 9301 + 49297) % 233280;
                const j = Math.floor((s / 233280) * (i + 1));
                [a[i], a[j]] = [a[j], a[i]];
            }
            return a;
        }

            else if (pct >= 55) msg = 'Good start. Focus on the sections with the lowest scores below.';
            else msg = 'Revisit the study material, then retake this part.';
            document.getElementById('modal-msg').textContent = msg;

            document.getElementById('modal').classList.add('show');
            localStorage.setItem('kanimath_m10_sci_part2', JSON.stringify({
                score: r.score, max: r.max, percentage: pct,
                date: new Date().toISOString(), answers
            }));
        }

        function showMarkScheme() {
            const html = questions.filter(q => q.scheme && q.scheme.length).map(q => `
                <div style="margin-bottom: 22px; padding-bottom: 16px; border-bottom: 1px solid var(--border);">
                    <div style="font-weight: 700; color: var(--primary); margin-bottom: 6px;">Q${q.id} &middot; ${q.topic} &middot; ${q.marks} marks</div>
                    <div style="margin-bottom: 8px; font-size: 13px;">${q.text.replace(/<[^>]*>/g, '').substring(0, 150)}${q.text.length > 150 ? '...' : ''}</div>
                    <ol style="margin-left: 18px;">
                        ${q.scheme.map(s => `<li style="margin-bottom: 5px; font-size: 13px; line-height: 1.6;">${s}</li>`).join('')}
                    </ol>
                </div>`).join('');
            document.getElementById('scheme-body').innerHTML = html;
            document.getElementById('scheme-modal').classList.add('show');
        }

        function showReview() {
            const rows = questions.map(q => {
                const a = answers[q.id];
                const s = scoreQuestion(q);
                let yourAnswer, correct;
                if (q.type === 'mcq') {
                    yourAnswer = a === undefined || a === null ? '<i>Not answered</i>' : `${String.fromCharCode(65 + a)}: ${q._opts[a]}`;
                    correct = `${String.fromCharCode(65 + q._correct)}: ${q._opts[q._correct]}`;
                } else {
                    yourAnswer = a ? a.replace(/</g, '&lt;').substring(0, 300) : '<i>Not answered</i>';
                    correct = `<b>Scheme:</b> ${q.scheme.join(' ')}`;
                }
                const col = s === q.marks ? 'var(--primary)' : s > 0 ? 'var(--warning)' : 'var(--danger)';
                return `<div style="padding: 14px 0; border-bottom: 1px solid var(--border);">
                    <div style="display:flex; justify-content:space-between; margin-bottom: 6px;">
                        <b style="color: var(--text-primary);">Q${q.id} &middot; ${q.topic}</b>
                        <span style="color:${col}; font-weight:700;">${s} / ${q.marks}</span>
                    </div>
                    <div style="font-size: 13px; margin-bottom: 4px;"><b>Your answer:</b> ${yourAnswer}</div>
                    <div style="font-size: 13px;">${correct}</div>
                    ${q.explanation ? `<div style="font-size: 13px; color: var(--secondary); margin-top: 4px;">${q.explanation}</div>` : ''}
                </div>`;
            }).join('');

            const r = buildResults();
            const topicRows = Object.entries(r.byTopic).map(([t, v]) => `
                <div style="display:flex; justify-content:space-between; padding: 8px 0; border-bottom: 1px solid var(--border); font-size: 14px;">
                    <span>${t}</span><span style="font-family: 'Fira Code', monospace;">${v.score} / ${v.max}</span>
                </div>`).join('');

            document.getElementById('scheme-body').innerHTML = `
                <h3 style="color: var(--primary); margin-bottom: 12px; font-size: 15px;">Score by topic</h3>
                ${topicRows}
                <h3 style="color: var(--primary); margin: 24px 0 8px; font-size: 15px;">Every answer</h3>
                ${rows}`;
            document.getElementById('scheme-modal').classList.add('show');
        }

        function downloadPDF() {
            const { jsPDF } = window.jspdf;
            const doc = new jsPDF();
            const r = buildResults();
            const pct = Math.round((r.score / r.max) * 100);

            doc.setFontSize(18);
            doc.setTextColor(6, 182, 212);
            doc.text('Kanishka_ISSR - IB MYP Science (M10)', 20, 20);
            doc.setFontSize(14);
            doc.setTextColor(60);
            doc.text('ESS Unit A: Evolution and the Origin of Life - Part 2', 20, 29);
            doc.setFontSize(10);
            doc.setTextColor(120);
            doc.text(`${new Date().toLocaleDateString()}  |  Evolution, Galapagos data analysis, Mutations`, 20, 36);

            doc.setFontSize(34);
            doc.setTextColor(16, 185, 129);
            doc.text(`${pct}%`, 20, 56);
            doc.setFontSize(11);
            doc.setTextColor(60);
            doc.text(`Total: ${r.score} / ${r.max} marks`, 62, 48);
            doc.text(`MCQ correct: ${r.mcqCorrect}/${r.mcqTotal}   Incomplete: ${r.wrong}   Skipped: ${r.skipped}`, 62, 56);

            let y = 72;
            doc.setFontSize(12);
            doc.setTextColor(6, 182, 212);
            doc.text('Score by topic', 20, y);
            y += 7;
            doc.setFontSize(9);
            Object.entries(r.byTopic).forEach(([t, v]) => {
                doc.setTextColor(80);
                doc.text(`${t}: ${v.score} / ${v.max} marks`, 20, y);
                y += 6;
            });

            y += 6;
            doc.setFontSize(12);
            doc.setTextColor(6, 182, 212);
            doc.text('Question results', 20, y);
            y += 7;

            questions.forEach((q) => {
                if (y > 262) { doc.addPage(); y = 20; }
                const s = scoreQuestion(q);
                doc.setFontSize(9);
                doc.setTextColor(s === q.marks ? 16 : s > 0 ? 200 : 220, s === q.marks ? 185 : s > 0 ? 150 : 68, s === q.marks ? 129 : s > 0 ? 20 : 68);
                doc.text(`Q${q.id} [${q.topic}] ${s}/${q.marks} marks`, 20, y);
                doc.setTextColor(110);
                const a = answers[q.id];
                const summary = q.type === 'mcq'
                    ? (a === undefined || a === null ? 'not answered' : `chose ${String.fromCharCode(65 + a)}`)
                    : (a ? `${a.replace(/\s+/g, ' ').substring(0, 70)}...` : 'not answered');
                doc.text(`Your answer: ${summary}`, 105, y);
                y += 6;
                if (y > 262) { doc.addPage(); y = 20; }
                doc.setTextColor(90);
                if (q.type === 'mcq') {
                    doc.text(`Correct: ${q.explanation.substring(0, 100)}`, 105, y);
                } else {
                    doc.text(`Scheme: ${q.scheme[0].replace(/<[^>]*>/g, '').substring(0, 100)}`, 105, y);
                }
                y += 8;
            });

            doc.setFontSize(8);
            doc.setTextColor(150);
            doc.text('Generated by Kanishka_ISSR', 105, 285, { align: 'center' });
            doc.save('M10_Science_ESS_Unit_A_Part2.pdf');
        }

        init();
    </script>
</body>
</html>
